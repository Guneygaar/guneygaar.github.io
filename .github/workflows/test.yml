name: Tests

on:
  push:
    branches: [main, main-/-root]
  pull_request:
    branches: [main, main-/-root]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install srtd-next deps
        run: cd srtd-next && npm ci
      - name: Type check srtd-next
        run: cd srtd-next && npx tsc --noEmit
      - name: Run tests
        env:
          TZ: Asia/Kolkata
        run: npm test

  check-e2e-paths:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - '03-auth.js'
              - '05-api.js'
              - '06-post-create.js'
              - '08-post-actions.js'
              - '09-approval.js'

  e2e-critical:
    needs: [test, check-e2e-paths]
    if: needs.check-e2e-paths.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical e2e specs (Chromium, headless)
        env:
          TZ: Asia/Kolkata
        run: npx playwright test --reporter=line tests/e2e/client-flows.spec.js tests/e2e/pcs.spec.js tests/e2e/admin-flows.spec.js
