name: Post-Deploy Smoke

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live smoke spec
        env:
          SORTED_CLIENT_EMAIL: ${{ secrets.SORTED_CLIENT_EMAIL }}
          SORTED_ADMIN_EMAIL: ${{ secrets.SORTED_ADMIN_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPECTED_VERSION: ${{ secrets.EXPECTED_VERSION }}
        run: npx playwright test tests/e2e/live-smoke-schedule.spec.js --reporter=line
